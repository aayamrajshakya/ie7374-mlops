name: Testing with Pytest
on:
    push:
        branches:
            - main
        paths:
            - "Assignment01/**"
            - ".github/workflows/pytest_action_A1L1.yml"
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: 3.11

            - name: Install dependencies
              run: pip install -r Assignment01/deps.txt

            - name: Run tests and generate XML report
              run: pytest -v --no-header Assignment01/test/test_pytest.py --junitxml=Assignment01/test/pytest-report.xml
              continue-on-error: false

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: Assignment01/test/pytest-report.xml

            - name: Notify on success
              if: success()
              run: echo "Tests passed successfully"

            - name: Send failure notification email
              if: failure()
              uses: dawidd6/action-send-mail@v3
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  username: ${{ secrets.GMAIL_USERNAME }}
                  password: ${{ secrets.GMAIL_APP_PASSWORD }}
                  subject: "CI Failed (Pytest): ${{ github.repository }}"
                  to: ${{ secrets.MY_EMAIL }}
                  from: "GitHub Actions <${{ secrets.GMAIL_USERNAME }}>"
                  body: |
                      Hello Aayam,

                      The workflow test has failed for ${{ github.repository }} on commit ${{ github.sha }}.

                      Check the run logs here:
                      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
